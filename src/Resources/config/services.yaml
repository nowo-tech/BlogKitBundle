services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Since 1.9.0 (REQ-ARCH-001 rule 6): every bundle service writes through the bundle's entity manager:
            # doctrine.entity_manager when set (a manager dedicated to the blog), else (since 2.0) its private manager.
            Doctrine\ORM\EntityManagerInterface $entityManager: '@nowo_blog_kit.entity_manager'

    Nowo\BlogKitBundle\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../Entity/'
            - '../../Controller/'
            - '../../NowoBlogKitBundle.php'
            - '../../Resources/'
            - '../../Event/'
            - '../../Security/BlogProtection.php'
            - '../../Security/BlogProtectionConfig.php'
            - '../../Security/Captcha/'
            - '../../Security/Html/'
            - '../../Security/RateLimit/'
            - '../../ValueObject/'
            - '../../Port/'
            - '../../Doctrine/'
            - '../../User/'
            - '../../Worker/BlogKitOwnEntityManagerSubscriber.php'

    # REQ-SF-004 rule 7: the controllers carry #[Route] and must not be autoconfigured. On Symfony >= 7.3
    # autoconfiguration tags them `routing.controller`, and the host's `controllers: { resource: routing.controllers }`
    # would then register the blog routes without the host importing routing.yaml (opt-in only, with its prefix).
    # Tagged explicitly instead; they extend AbstractController, hence the service subscriber tag.
    Nowo\BlogKitBundle\Controller\:
        resource: '../../Controller/'
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Nowo\BlogKitBundle\Locale\BlogLocales:
        public: true
        arguments:
            $defaultLocale: '%nowo_blog_kit.default_locale%'
            $locales: '%nowo_blog_kit.locales%'

    Nowo\BlogKitBundle\Form\:
        resource: '../../Form/'
        tags: ['form.type']

    Nowo\BlogKitBundle\Twig\BlogKitExtension:
        arguments:
            # Since 2.0: the layout / CSS / icon / row-action arguments feed no global any more (deprecated, null).
            $layoutTemplate: null
            $publicLayoutTemplate: null
            $cssFramework: null
            $defaultLocale: '%nowo_blog_kit.default_locale%'
            $locales: '%nowo_blog_kit.locales%'
            $privacyUrl: '%nowo_blog_kit.web_ui.privacy_url%'
            $protection: '@Nowo\BlogKitBundle\Security\BlogProtection'
        tags: ['twig.extension']

    Nowo\BlogKitBundle\EventSubscriber\BlogArticlePublishedDoctrineSubscriber:
        tags:
            - { name: doctrine.event_listener, event: onFlush }
            - { name: doctrine.event_listener, event: postFlush }

    Nowo\BlogKitBundle\EventSubscriber\BlogArticleHtmlSanitizeSubscriber:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: preUpdate }
