nowo_blog_kit:
    # user_class: App\Entity\Auth\User
    default_locale: es
    locales: [es, en]
    security:
        # Any access role grants every capability; roles.* add per-action roles (an empty list grants nothing).
        access_roles: [ROLE_ADMIN]
        roles:
            manage: [ROLE_EDITOR]
            moderate: [ROLE_MODERATOR]
            configure: [ROLE_ADMIN]
        allow_unauthenticated: false
        object_access:
            strategy: none
            # strategy: owner
            # strategy: service
            # service: App\Security\BlogPublicationAccessChecker
    # Layouts and CSS stack come from nowo_ui_kit (layouts.admin / layouts.guest, css_framework, icon_set,
    # row_actions_display) — REQ-UI-003. Set web_ui.layout_template / public_layout_template only to override them.
    web_ui:
        page_size: 20
        privacy_url: '/privacy'
    listing:
        mode: paginated
        masonry:
            strategy: masonry
            columns_mobile: 1
            columns_tablet: 2
            columns_desktop: 2
    comments:
        staff_name: 'Team'   # public name of staff replies (or implement BlogStaffDisplayNameInterface)
        rate_limit:
            strategy: fixed_window
            limit: 5
            interval_seconds: 60
        captcha:
            strategy: honeypot
    html:
        sanitize:
            strategy: allowlist
    doctrine:
        table_prefix: ''

when@prod:
    nowo_blog_kit:
        html:
            sanitize:
                strategy: allowlist
