nowo_blog_kit:
    user_class: App\Entity\User
    default_locale: en
    locales: [en, es]
    security:
        access_roles: [ROLE_ADMIN]
        roles:
            manage: [ROLE_ADMIN]
            moderate: [ROLE_ADMIN]
            configure: [ROLE_ADMIN]
        allow_unauthenticated: false
        # object_access:
        #     strategy: owner
    # Layouts, CSS stack and row actions come from nowo_ui_kit (layouts.admin / layouts.guest), REQ-UI-003.
    web_ui:
        page_size: 20
    listing:
        mode: infinite
        masonry:
            strategy: masonry
            columns_mobile: 1
            columns_tablet: 2
            columns_desktop: 2
    comments:
        rate_limit:
            strategy: fixed_window
            limit: 5
            interval_seconds: 60
        captcha:
            strategy: honeypot
    html:
        sanitize:
            strategy: allowlist
    doctrine:
        table_prefix: ''
