# REQ-DEMO-015: demo forms are FormKit forms on UiKit's form theme (twig.yaml), not on a CSS framework.
# The `blog_kit` (CRUD) and `filter` (GET lists) profiles come from the bundle's own prepended defaults (UiKit classes).
nowo_form_kit:
    css_framework: none
    default_profile: demo
    type_map:
        entity: Symfony\Bridge\Doctrine\Form\Type\EntityType
    profiles:
        demo:
            alias: demo
            translation_domain: messages
            defaults:
                row_attr:
                    class: 'nowo-ui-form-row'
            field_types: {}
