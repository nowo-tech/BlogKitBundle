name: blog-kit-bundle-demo-symfony-8

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-kit-bundle-demo-symfony-8-php
    working_dir: /app
    ports:
      - "${PORT:-8105}:80"
    volumes:
      - .:/app
      - ../..:/var/blog-kit-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
      - DATABASE_URL=${DATABASE_URL:-mysql://app:app@database:3306/app?serverVersion=8.4&charset=utf8mb4}
    # Public DNS for Composer / Packagist (Docker/WSL resolver failures)
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      database:
        condition: service_healthy
    networks:
      - blog-kit-demo-network

###> doctrine/doctrine-bundle ###
  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database_data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - blog-kit-demo-network
###< doctrine/doctrine-bundle ###

volumes:
  composer-cache:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
    driver: local

networks:
  blog-kit-demo-network:
    driver: bridge
